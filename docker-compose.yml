
version: '3.9'

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - EVENTS=1
      - STATS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dockpilot
      POSTGRES_USER: dockpilot
      POSTGRES_PASSWORD: dockpilot
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dockpilot:dockpilot@postgres:5432/dockpilot
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      DOCKER_HOST: http://socket-proxy:2375
      NGINX_SITES_DIR: /etc/nginx/sites-enabled
      NODE_ENV: production
    volumes:
      - ./api:/usr/src/app
      - ./uploads:/usr/src/app/uploads
      - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - socket-proxy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: http://api:3000
      NODE_ENV: production
    volumes:
      - ./ui:/usr/src/app
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
