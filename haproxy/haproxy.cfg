global
  log stdout format raw local0
  # Optional: create /var/lib/haproxy via a volume so HAProxy can store server state.
  # If you don't provide the volume, comment the next line out to silence the NOTICE.
  # server-state-file /var/lib/haproxy/server-state

defaults
  mode http
  option httplog
  log global
  timeout connect 5s
  timeout client  30s
  timeout server  30s
  default-server init-addr last,libc,none

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries       3
  timeout resolve       1s
  hold valid            10s

# Frontend: route /api to API, everything else to UI
frontend dockerfrontend
  bind *:80
  # If we previously had restrictive ACLs like "http-request deny if !{ src ... }", remove them.
  # Make sure we always select a backend (prevents 403 <NOSRV>).
  acl is_api path_beg /api
  acl is_uploads path_beg /uploads
  http-request set-path %[path,regsub(^/api,/,)] if is_api
  use_backend api         if is_api or is_uploads
  default_backend ui

# UI backend
backend ui
  option httpchk GET /
  server ui ui:6452 check resolvers docker resolve-prefer ipv4 init-addr none

# API backend
backend api
  option httpchk GET /health
  server api api:6453 check resolvers docker resolve-prefer ipv4 init-addr none

# Docker events backend (fix missing timeouts warning)
backend docker-events
  mode http
  # Adjust target to the service that exposes the Docker Socket Proxy (e.g., socket-proxy)
  option httpchk GET /version
  server events socket-proxy:2375 check resolvers docker resolve-prefer ipv4 init-addr none
